<nav
  class="navbar fixed inset-x-0 top-0 z-50"
  [ngClass]="{ 'navbar-scrolled': isScrolled }"
  aria-label="Main navigation"
>
  <div
    class="relative mx-auto flex h-20 w-full max-w-7xl items-center justify-between px-5 sm:px-6 lg:px-8"
  >
    <!-- ==================== BRAND ==================== -->
    <a
      href="#home"
      (click)="scrollToSection('#home', $event)"
      class="group flex shrink-0 items-center gap-3"
      aria-label="Go to homepage"
    >
      <span
        class="relative flex h-10 w-10 items-center justify-center overflow-hidden rounded-xl border border-accent-teal/25 bg-accent-teal/[0.07] transition-all duration-300 group-hover:-translate-y-0.5 group-hover:border-accent-teal/45 group-hover:bg-accent-teal/[0.11]"
      >
        <span
          class="absolute inset-0 bg-gradient-to-br from-accent-teal/10 to-accent-violet/10 opacity-0 transition-opacity duration-300 group-hover:opacity-100"
          aria-hidden="true"
        ></span>
        <i
          class="fas fa-code relative z-10 text-sm text-accent-teal transition-transform duration-300 group-hover:scale-110"
          aria-hidden="true"
        ></i>
      </span>

      <span
        class="font-display text-lg font-semibold tracking-tight text-ink sm:text-xl"
      >
        Port<span class="text-accent-teal">Folio</span>
      </span>
    </a>

    <!-- ==================== DESKTOP NAV ==================== -->
    <div class="hidden items-center lg:flex">
      <div
        class="flex items-center gap-1 rounded-full border border-hairline/80 bg-night-soft/55 p-1 backdrop-blur-xl"
      >
        <a
          href="#home"
          (click)="scrollToSection('#home', $event)"
          class="nav-link flex items-center gap-2 rounded-full px-4 py-2.5 text-sm font-medium"
        >
          <i class="fas fa-home text-[11px]" aria-hidden="true"></i>
          <span>Home</span>
        </a>

        <a
          href="#about"
          (click)="scrollToSection('#about', $event)"
          class="nav-link flex items-center gap-2 rounded-full px-4 py-2.5 text-sm font-medium"
        >
          <i class="fas fa-user text-[11px]" aria-hidden="true"></i>
          <span>About</span>
        </a>

        <a
          href="#projects"
          (click)="scrollToSection('#projects', $event)"
          class="nav-link flex items-center gap-2 rounded-full px-4 py-2.5 text-sm font-medium"
        >
          <i class="fas fa-layer-group text-[11px]" aria-hidden="true"></i>
          <span>Projects</span>
        </a>

        <a
          href="#skills"
          (click)="scrollToSection('#skills', $event)"
          class="nav-link flex items-center gap-2 rounded-full px-4 py-2.5 text-sm font-medium"
        >
          <i class="fas fa-code text-[11px]" aria-hidden="true"></i>
          <span>Skills</span>
        </a>
      </div>
    </div>

    <!-- ==================== MOBILE TOGGLE ==================== -->
    <div class="flex shrink-0 lg:hidden">
      <button
        type="button"
        (click)="toggleMobileMenu()"
        class="mobile-menu-button group relative flex h-11 w-11 items-center justify-center rounded-xl border border-hairline bg-surface/40 text-muted backdrop-blur-xl transition-all duration-300 hover:border-accent-teal/30 hover:bg-accent-teal/[0.06] hover:text-accent-teal focus:outline-none focus-visible:ring-2 focus-visible:ring-accent-teal/50"
        [attr.aria-expanded]="isMobileMenuOpen"
        aria-controls="mobile-navigation"
        aria-label="Toggle navigation menu"
      >
        <span class="relative h-5 w-5" aria-hidden="true">
          <span
            class="absolute left-0 top-1 h-[1.5px] w-5 rounded-full bg-current transition-all duration-300"
            [ngClass]="{ 'top-1/2 rotate-45': isMobileMenuOpen }"
          ></span>
          <span
            class="absolute left-0 top-1/2 h-[1.5px] w-5 -translate-y-1/2 rounded-full bg-current transition-all duration-300"
            [ngClass]="{ 'scale-0 opacity-0': isMobileMenuOpen }"
          ></span>
          <span
            class="absolute bottom-1 left-0 h-[1.5px] w-5 rounded-full bg-current transition-all duration-300"
            [ngClass]="{ 'bottom-1/2 -rotate-45': isMobileMenuOpen }"
          ></span>
        </span>
      </button>
    </div>
  </div>

  <!-- ==================== MOBILE MENU ==================== -->
  <div
    id="mobile-navigation"
    class="mobile-menu lg:hidden"
    [class.mobile-menu-open]="isMobileMenuOpen"
  >
    <div
      class="border-t border-hairline/80 bg-night/95 px-5 pb-6 pt-4 backdrop-blur-2xl sm:px-6"
    >
      <div class="space-y-1">
        <a
          href="#home"
          (click)="scrollToSection('#home', $event)"
          class="mobile-nav-link group flex items-center gap-3 rounded-2xl px-3 py-3"
        >
          <span class="icon-tile h-9 w-9 rounded-xl">
            <i class="fas fa-home text-xs" aria-hidden="true"></i>
          </span>
          <span class="min-w-0">
            <span class="mobile-link-title block text-sm font-medium text-ink">
              Home
            </span>
            <span class="mt-0.5 block text-xs text-muted/70">Welcome</span>
          </span>
        </a>

        <a
          href="#about"
          (click)="scrollToSection('#about', $event)"
          class="mobile-nav-link group flex items-center gap-3 rounded-2xl px-3 py-3"
        >
          <span class="icon-tile h-9 w-9 rounded-xl">
            <i class="fas fa-user text-xs" aria-hidden="true"></i>
          </span>
          <span class="min-w-0">
            <span class="mobile-link-title block text-sm font-medium text-ink">
              About
            </span>
            <span class="mt-0.5 block text-xs text-muted/70">My story</span>
          </span>
        </a>

        <a
          href="#projects"
          (click)="scrollToSection('#projects', $event)"
          class="mobile-nav-link group flex items-center gap-3 rounded-2xl px-3 py-3"
        >
          <span class="icon-tile h-9 w-9 rounded-xl">
            <i class="fas fa-layer-group text-xs" aria-hidden="true"></i>
          </span>
          <span class="min-w-0">
            <span class="mobile-link-title block text-sm font-medium text-ink">
              Projects
            </span>
            <span class="mt-0.5 block text-xs text-muted/70">
              Selected work
            </span>
          </span>
        </a>

        <a
          href="#skills"
          (click)="scrollToSection('#skills', $event)"
          class="mobile-nav-link group flex items-center gap-3 rounded-2xl px-3 py-3"
        >
          <span class="icon-tile h-9 w-9 rounded-xl">
            <i class="fas fa-code text-xs" aria-hidden="true"></i>
          </span>
          <span class="min-w-0">
            <span class="mobile-link-title block text-sm font-medium text-ink">
              Skills
            </span>
            <span class="mt-0.5 block text-xs text-muted/70">
              Technologies
            </span>
          </span>
        </a>
      </div>

      <div class="mt-4 border-t border-hairline/70 pt-5">
        <p
          class="mb-3 px-1 font-mono text-[10px] font-medium uppercase tracking-[0.2em] text-muted/80"
        >
          Connect
        </p>

        <div class="flex gap-2">
          <a
            href="https://www.facebook.com/shanu.shajahan.336/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Facebook"
            class="icon-tile h-10 w-10 hover:border-accent-teal/30 hover:bg-accent-teal/[0.07] hover:text-accent-teal"
          >
            <i class="fab fa-facebook-f text-sm" aria-hidden="true"></i>
          </a>

          <a
            href="https://www.linkedin.com/in/shanushajahan/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="LinkedIn"
            class="icon-tile h-10 w-10 hover:border-accent-teal/30 hover:bg-accent-teal/[0.07] hover:text-accent-teal"
          >
            <i class="fab fa-linkedin-in text-sm" aria-hidden="true"></i>
          </a>

          <a
            href="https://www.instagram.com/____shxnu/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Instagram"
            class="icon-tile h-10 w-10 hover:border-accent-violet/30 hover:bg-accent-violet/[0.08] hover:text-accent-violet"
          >
            <i class="fab fa-instagram text-sm" aria-hidden="true"></i>
          </a>
        </div>
      </div>
    </div>
  </div>
</nav>
