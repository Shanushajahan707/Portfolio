<nav
  class="navbar fixed top-0 left-0 right-0 z-50 transition-all duration-500 ease-out"
  [ngClass]="{
    'navbar-scrolled': isScrolled
  }"
  aria-label="Main navigation"
>
  <!-- Ambient background -->
  <div class="pointer-events-none absolute inset-0 overflow-hidden">
    <div
      class="absolute -top-20 left-[20%] h-40 w-40 rounded-full bg-cyan-400/[0.04] blur-xl"
    ></div>

    <div
      class="absolute -top-20 right-[20%] h-40 w-40 rounded-full bg-blue-500/[0.04] blur-xl"
    ></div>
  </div>

  <!-- Navbar content -->
  <div class="relative w-full px-3 sm:px-4 md:px-6 lg:mx-auto lg:max-w-7xl lg:px-8">
    <div class="flex h-[76px] items-center justify-between w-full">

      <!-- ==================== LOGO ==================== -->
      <div class="flex-shrink-0">
        <a
          (click)="scrollToSection('#home')"
          class="group flex cursor-pointer items-center gap-2 sm:gap-3"
          aria-label="Go to homepage"
        >
          <!-- Logo mark -->
          <div
            class="
              relative flex h-9 w-9 sm:h-10 sm:w-10 items-center justify-center
              overflow-hidden rounded-xl
              border border-cyan-400/20
              bg-white/[0.04]
              shadow-[0_0_30px_rgba(34,211,238,0.08)]
              transition-all duration-300
              group-hover:border-cyan-400/40
              group-hover:bg-cyan-400/[0.08]
              group-hover:shadow-[0_0_35px_rgba(34,211,238,0.15)]
              group-hover:-translate-y-0.5
            "
          >
            <div
              class="
                absolute inset-0
                bg-gradient-to-br
                from-cyan-400/10
                to-blue-500/10
                opacity-0
                transition-opacity duration-300
                group-hover:opacity-100
              "
            ></div>

            <i
              class="
                fas fa-code
                relative z-10
                text-xs sm:text-sm text-cyan-400
                transition-transform duration-300
                group-hover:scale-110
              "
            ></i>
          </div>

          <!-- Brand -->
          <div class="flex items-baseline">
            <span
              class="
                text-lg sm:text-xl font-semibold tracking-tight text-white
                transition-colors duration-300
                group-hover:text-cyan-50
              "
            >
              Port
            </span>

            <span
              class="
                text-lg sm:text-xl font-semibold tracking-tight text-cyan-400
                transition-colors duration-300
                group-hover:text-cyan-300
              "
            >
              Folio
            </span>
          </div>
        </a>
      </div>


      <!-- ==================== DESKTOP NAV ==================== -->
      <div class="hidden items-center lg:flex">

        <div
          class="
            flex items-center gap-1
            rounded-2xl
            border border-white/[0.06]
            bg-white/[0.025]
            p-1
            backdrop-blur-sm
          "
        >

          <!-- Home -->
          <a
            (click)="scrollToSection('#home')"
            class="
              nav-link group relative
              flex items-center gap-2
              rounded-xl
              px-4 py-2.5
              text-sm font-medium
              text-gray-400
              transition-all duration-300
              hover:bg-white/[0.05]
              hover:text-white
            "
          >
            <i
              class="
                fas fa-home text-[11px]
                text-gray-500
                transition-colors duration-300
                group-hover:text-cyan-400
              "
            ></i>

            <span>Home</span>

            <span
              class="
                absolute bottom-1 left-1/2
                h-0.5 w-0
                -translate-x-1/2
                rounded-full
                bg-cyan-400
                transition-all duration-300
                group-hover:w-5
              "
            ></span>
          </a>


          <!-- About -->
          <a
            (click)="scrollToSection('#about')"
            class="
              nav-link group relative
              flex items-center gap-2
              rounded-xl
              px-4 py-2.5
              text-sm font-medium
              text-gray-400
              transition-all duration-300
              hover:bg-white/[0.05]
              hover:text-white
            "
          >
            <i
              class="
                fas fa-user text-[11px]
                text-gray-500
                transition-colors duration-300
                group-hover:text-cyan-400
              "
            ></i>

            <span>About</span>

            <span
              class="
                absolute bottom-1 left-1/2
                h-0.5 w-0
                -translate-x-1/2
                rounded-full
                bg-cyan-400
                transition-all duration-300
                group-hover:w-5
              "
            ></span>
          </a>


          <!-- Projects -->
          <a
            (click)="scrollToSection('#projects')"
            class="
              nav-link group relative
              flex items-center gap-2
              rounded-xl
              px-4 py-2.5
              text-sm font-medium
              text-gray-400
              transition-all duration-300
              hover:bg-white/[0.05]
              hover:text-white
            "
          >
            <i
              class="
                fas fa-layer-group text-[11px]
                text-gray-500
                transition-colors duration-300
                group-hover:text-cyan-400
              "
            ></i>

            <span>Projects</span>

            <span
              class="
                absolute bottom-1 left-1/2
                h-0.5 w-0
                -translate-x-1/2
                rounded-full
                bg-cyan-400
                transition-all duration-300
                group-hover:w-5
              "
            ></span>
          </a>


          <!-- Skills -->
          <a
            (click)="scrollToSection('#skills')"
            class="
              nav-link group relative
              flex items-center gap-2
              rounded-xl
              px-4 py-2.5
              text-sm font-medium
              text-gray-400
              transition-all duration-300
              hover:bg-white/[0.05]
              hover:text-white
            "
          >
            <i
              class="
                fas fa-code text-[11px]
                text-gray-500
                transition-colors duration-300
                group-hover:text-cyan-400
              "
            ></i>

            <span>Skills</span>

            <span
              class="
                absolute bottom-1 left-1/2
                h-0.5 w-0
                -translate-x-1/2
                rounded-full
                bg-cyan-400
                transition-all duration-300
                group-hover:w-5
              "
            ></span>
          </a>

        </div>
      </div>


      <!-- ==================== MOBILE BUTTON ==================== -->
      <div class="lg:hidden flex-shrink-0">

        <button
          type="button"
          (click)="toggleMobileMenu()"
          class="
            group relative
            flex h-10 w-10 sm:h-11 sm:w-11
            items-center justify-center
            rounded-xl
            border border-white/[0.08]
            bg-white/[0.04]
            text-gray-400
            backdrop-blur-sm
            transition-all duration-300
            hover:border-cyan-400/30
            hover:bg-cyan-400/[0.06]
            hover:text-cyan-400
            focus:outline-none
            focus:ring-2
            focus:ring-cyan-400/40
          "
          [attr.aria-expanded]="isMobileMenuOpen"
          aria-controls="mobile-navigation"
          aria-label="Toggle navigation menu"
        >

          <div class="relative h-5 w-5">

            <span
              class="
                absolute left-0 top-1
                h-[1.5px] w-5
                rounded-full bg-current
                transition-all duration-300
              "
              [ngClass]="{
                'top-1/2 rotate-45': isMobileMenuOpen
              }"
            ></span>

            <span
              class="
                absolute left-0 top-1/2
                h-[1.5px] w-5
                -translate-y-1/2
                rounded-full bg-current
                transition-all duration-300
              "
              [ngClass]="{
                'scale-0 opacity-0': isMobileMenuOpen
              }"
            ></span>

            <span
              class="
                absolute bottom-1 left-0
                h-[1.5px] w-5
                rounded-full bg-current
                transition-all duration-300
              "
              [ngClass]="{
                'bottom-1/2 -rotate-45': isMobileMenuOpen
              }"
            ></span>

          </div>
        </button>

      </div>

    </div>
  </div>


  <!-- ==================== MOBILE MENU ==================== -->
  <div
    id="mobile-navigation"
    class="
      lg:hidden
      overflow-hidden
      transition-all duration-500 ease-out
    "
    [ngClass]="{
      'max-h-[500px] opacity-100': isMobileMenuOpen,
      'max-h-0 opacity-0': !isMobileMenuOpen
    }"
  >

    <div
      class="
        border-t border-white/[0.06]
        bg-gray-950/90
        px-3 sm:px-4 md:px-6 pb-6 pt-4
        shadow-2xl
        backdrop-blur-sm
        w-full
      "
    >

      <div class="w-full space-y-1">

        <!-- Home -->
        <a
          (click)="scrollToSection('#home'); closeMobileMenu()"
          class="
            group flex cursor-pointer
            items-center gap-3 sm:gap-4
            rounded-2xl
            border border-transparent
            px-3 sm:px-4 py-3 sm:py-3.5
            text-gray-300
            transition-all duration-300
            hover:border-cyan-400/10
            hover:bg-cyan-400/[0.05]
            hover:text-white
          "
        >
          <div
            class="
              flex h-8 w-8 sm:h-9 sm:w-9 shrink-0
              items-center justify-center
              rounded-xl
              bg-cyan-400/[0.08]
              text-cyan-400
              transition-transform duration-300
              group-hover:scale-105
            "
          >
            <i class="fas fa-home text-[10px] sm:text-xs"></i>
          </div>

          <div>
            <div class="text-sm font-medium">Home</div>
            <div class="mt-0.5 text-xs text-gray-500">
              Welcome
            </div>
          </div>
        </a>


        <!-- About -->
        <a
          (click)="scrollToSection('#about'); closeMobileMenu()"
          class="
            group flex cursor-pointer
            items-center gap-3 sm:gap-4
            rounded-2xl
            border border-transparent
            px-3 sm:px-4 py-3 sm:py-3.5
            text-gray-300
            transition-all duration-300
            hover:border-cyan-400/10
            hover:bg-cyan-400/[0.05]
            hover:text-white
          "
        >
          <div
            class="
              flex h-8 w-8 sm:h-9 sm:w-9 shrink-0
              items-center justify-center
              rounded-xl
              bg-cyan-400/[0.08]
              text-cyan-400
              transition-transform duration-300
              group-hover:scale-105
            "
          >
            <i class="fas fa-user text-[10px] sm:text-xs"></i>
          </div>

          <div>
            <div class="text-sm font-medium">About</div>
            <div class="mt-0.5 text-xs text-gray-500">
              My story
            </div>
          </div>
        </a>


        <!-- Projects -->
        <a
          (click)="scrollToSection('#projects'); closeMobileMenu()"
          class="
            group flex cursor-pointer
            items-center gap-3 sm:gap-4
            rounded-2xl
            border border-transparent
            px-3 sm:px-4 py-3 sm:py-3.5
            text-gray-300
            transition-all duration-300
            hover:border-cyan-400/10
            hover:bg-cyan-400/[0.05]
            hover:text-white
          "
        >
          <div
            class="
              flex h-8 w-8 sm:h-9 sm:w-9 shrink-0
              items-center justify-center
              rounded-xl
              bg-cyan-400/[0.08]
              text-cyan-400
              transition-transform duration-300
              group-hover:scale-105
            "
          >
            <i class="fas fa-layer-group text-[10px] sm:text-xs"></i>
          </div>

          <div>
            <div class="text-sm font-medium">Projects</div>
            <div class="mt-0.5 text-xs text-gray-500">
              Selected work
            </div>
          </div>
        </a>


        <!-- Skills -->
        <a
          (click)="scrollToSection('#skills'); closeMobileMenu()"
          class="
            group flex cursor-pointer
            items-center gap-3 sm:gap-4
            rounded-2xl
            border border-transparent
            px-3 sm:px-4 py-3 sm:py-3.5
            text-gray-300
            transition-all duration-300
            hover:border-cyan-400/10
            hover:bg-cyan-400/[0.05]
            hover:text-white
          "
        >
          <div
            class="
              flex h-8 w-8 sm:h-9 sm:w-9 shrink-0
              items-center justify-center
              rounded-xl
              bg-cyan-400/[0.08]
              text-cyan-400
              transition-transform duration-300
              group-hover:scale-105
            "
          >
            <i class="fas fa-code text-[10px] sm:text-xs"></i>
          </div>

          <div>
            <div class="text-sm font-medium">Skills</div>
            <div class="mt-0.5 text-xs text-gray-500">
              Technologies
            </div>
          </div>
        </a>


        <!-- Social links -->
        <div class="mt-4 border-t border-white/[0.06] pt-5">

          <div class="mb-3 px-1 text-[11px] font-medium uppercase tracking-[0.2em] text-gray-600">
            Connect
          </div>

          <div class="flex gap-2">

            <!-- Facebook -->
            <a
              href="https://www.facebook.com/shanu.shajahan.336/"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Facebook"
              class="
                flex h-9 w-9 sm:h-10 sm:w-10 items-center justify-center
                rounded-xl
                border border-white/[0.06]
                bg-white/[0.03]
                text-gray-400
                transition-all duration-300
                hover:border-blue-400/30
                hover:bg-blue-400/[0.08]
                hover:text-blue-400
                hover:-translate-y-0.5
              "
            >
              <i class="fab fa-facebook-f text-xs sm:text-sm"></i>
            </a>


            <!-- LinkedIn -->
            <a
              href="https://www.linkedin.com/in/shanushajahan/"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="LinkedIn"
              class="
                flex h-9 w-9 sm:h-10 sm:w-10 items-center justify-center
                rounded-xl
                border border-white/[0.06]
                bg-white/[0.03]
                text-gray-400
                transition-all duration-300
                hover:border-blue-400/30
                hover:bg-blue-400/[0.08]
                hover:text-blue-400
                hover:-translate-y-0.5
              "
            >
              <i class="fab fa-linkedin-in text-xs sm:text-sm"></i>
            </a>


            <!-- Instagram -->
            <a
              href="https://www.instagram.com/____shxnu/"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Instagram"
              class="
                flex h-9 w-9 sm:h-10 sm:w-10 items-center justify-center
                rounded-xl
                border border-white/[0.06]
                bg-white/[0.03]
                text-gray-400
                transition-all duration-300
                hover:border-pink-400/30
                hover:bg-pink-400/[0.08]
                hover:text-pink-400
                hover:-translate-y-0.5
              "
            >
              <i class="fab fa-instagram text-xs sm:text-sm"></i>
            </a>

          </div>
        </div>

      </div>
    </div>
  </div>
</nav>
