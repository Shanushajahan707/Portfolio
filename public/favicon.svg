<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#101B33" />
      <stop offset="1" stop-color="#080D1A" />
    </linearGradient>
    <linearGradient id="glyph" x1="13" y1="19" x2="51" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE" />
      <stop offset="1" stop-color="#8B5CF6" />
    </linearGradient>
    <clipPath id="round">
      <rect width="64" height="64" rx="14" />
    </clipPath>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)" />

  <!-- aurora glows -->
  <g clip-path="url(#round)" aria-hidden="true">
    <circle cx="50" cy="10" r="19" fill="#22D3EE" opacity="0.16" />
    <circle cx="8" cy="58" r="17" fill="#8B5CF6" opacity="0.18" />
    <circle cx="58" cy="58" r="10" fill="#F59E0B" opacity="0.08" />
  </g>

  <!-- hairline inner border -->
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#22D3EE" stroke-opacity="0.2" stroke-width="2" />

  <!-- < / > mark -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M25 19 13 32l12 13" stroke="url(#glyph)" stroke-width="5.5" />
    <path d="M39 19l12 13-12 13" stroke="url(#glyph)" stroke-width="5.5" />
    <path d="M36.5 15.5l-9 33" stroke="#F59E0B" stroke-width="5" />
  </g>
</svg>
